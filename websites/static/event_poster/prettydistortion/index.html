<script>
/* ============ DATA — edit once, updates everywhere ============ */
const DATA = {
  dateBig:"29 AUG", dateDay:"SATURDAY", timeBig:"8.00 PM",
  headliner:"TALAMASKA", support1:"SQUADOUT!",
  venue:"RAASTA, NAGPUR", phone:"RESERVATIONS - 8624927829",
  paraLeft:"ROOTED IN EXPERIENCE AND REACHING FOR THE SONIC STRATOSPHERE, TALAMASKA BRINGS A UNIQUE MOUNTAIN-FORGED ENERGY TO THE ELECTRONIC LANDSCAPE FROM HER BASE IN PUNE. BORN AMIDST THE MAJESTIC HIMALAYAS, HER VERY NAME, INSPIRED BY THE SANSKRIT WORD FOR RHYTHM, FORESHADOWS THE INTRICATE AND CAPTIVATING SONIC TAPESTRY SHE IS KNOWN FOR. SETS THAT DETONATE WITH ENERGY AND GROOVE, NEVER AFRAID TO SHATTER GENRE BOUNDARIES, SEAMLESSLY WEAVING THE POWERFUL CURRENTS OF ELECTRO AND THE BROKEN BEATS INTO THE HYPNOTIC DEPTHS OF MINIMAL AND ACID. BASS, SOME IDM, UK GRIME, BAILE AND THE RAW ENERGY OF TECHNO.",
  paraRight:"PRETTY DISTORTION is a bold new IP on RAASTA, blending beauty, chaos, music, and nightlife into one immersive experience. It represents a generation that embraces imperfections, breaks the usual rules, and turns distortion into a statement. With striking visuals, high-energy music, and an unapologetic atmosphere, PRETTY DISTORTION creates a night where everything feels beautifully unexpected.",
  modelImages:[
    "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=900&q=80",
    "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=900&q=80",
    "https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=900&q=80"
  ]
};
for (const [id,val] of Object.entries({dateBig:DATA.dateBig,dateDay:DATA.dateDay,timeBig:DATA.timeBig,
  headliner:DATA.headliner,support1:DATA.support1,venueLine:DATA.venue,phoneLine:DATA.phone,
  paraLeft:DATA.paraLeft,paraRight:DATA.paraRight})) document.getElementById(id).textContent = val;

/* ---- stage autoscale ---- */
const stage=document.getElementById('stage');
const fit=()=>{stage.style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1200,innerHeight/1600)})`};
addEventListener('resize',fit);fit();

/* ---- model photo → alpha cutout (bg keying) ---- */
let mi=0; const mc=document.getElementById('modelCanvas');
(function loadModel(){
  const img=new Image(); img.crossOrigin='anonymous';
  img.onload=()=>{
    const w=img.naturalWidth,h=img.naturalHeight;
    const off=document.createElement('canvas');off.width=w;off.height=h;
    const c=off.getContext('2d');c.drawImage(img,0,0);
    try{
      const d=c.getImageData(0,0,w,h),p=d.data;
      const px=(x,y)=>{const i=(y*w+x)*4;return[p[i],p[i+1],p[i+2]]};
      const cs=[px(2,2),px(w-3,2),px(2,h-3),px(w-3,h-3)];
      const bg=[0,1,2].map(k=>cs.reduce((a,c)=>a+c[k],0)/4);
      for(let i=0;i<p.length;i+=4){
        const dr=p[i]-bg[0],dg=p[i+1]-bg[1],db=p[i+2]-bg[2];
        const dist=Math.sqrt(dr*dr+dg*dg+db*db);
        p[i+3]=Math.round(Math.min(1,Math.max(0,(dist-26)/70))*255);
      }
      c.putImageData(d,0,0);
    }catch(e){mc.classList.add('multiply')}
    mc.width=w;mc.height=h;mc.getContext('2d').drawImage(off,0,0);
    if(window.gsap)gsap.fromTo(mc,{autoAlpha:0,y:60},{autoAlpha:1,y:0,duration:1,ease:'power3.out',delay:.6});
  };
  img.onerror=()=>{if(DATA.modelImages[++mi])img.src=DATA.modelImages[mi]};
  img.src=DATA.modelImages[mi];
})();

/* ---- entrance + parallax ---- */
addEventListener('load',()=>{document.fonts.ready.then(()=>{
  gsap.to('#loader',{autoAlpha:0,duration:.6,delay:.1});
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});
  tl.from('.bar-top',{y:'-100%',duration:.7}).from('.bar-bottom',{y:'100%',duration:.7},'<')
    .from('.hdr > *',{y:-26,autoAlpha:0,stagger:.12,duration:.8},'-=.3')
    .from('.title-wrap',{scale:.55,autoAlpha:0,duration:1.2,ease:'elastic.out(1,.55)'},'-=.3')
    .from('.para-left',{x:-40,autoAlpha:0},'<.2').from('.para-right',{x:40,autoAlpha:0},'<.1')
    .from('.date',{x:70,autoAlpha:0},'<.1').from('.feat',{x:-60,autoAlpha:0},'<.1')
    .from('.also',{x:-60,autoAlpha:0},'<.1').from('.venue',{y:40,autoAlpha:0},'<.1')
    .from('.time',{x:70,autoAlpha:0},'<.1')
    .from('.tickets,.fortytwo',{autoAlpha:0,scale:.8,stagger:.08},'<.1')
    .from('.sponsors > *',{y:24,autoAlpha:0,stagger:.07},'<.1');
  gsap.to('.title-wrap',{y:10,duration:2.6,yoyo:true,repeat:-1,ease:'sine.inOut',delay:2});
  document.querySelectorAll('[data-depth]').forEach(el=>{
    const d=+el.dataset.depth,qx=gsap.quickTo(el,'x',{duration:.8}),qy=gsap.quickTo(el,'y',{duration:.8});
    addEventListener('mousemove',e=>{qx((e.clientX/innerWidth-.5)*d*900);qy((e.clientY/innerHeight-.5)*d*900)});
  });
})});
